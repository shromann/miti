[project]
name = "miti"
version = "0.1.0"
description = "Rule-first, auditable Gmail inbox automation"
readme = "README.md"
authors = [
    { name = "Shromann Majumder", email = "shromannmajumder@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.160",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.28",
    "typer>=0.15",
]

[project.scripts]
miti = "miti.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
